{% extends "base.html" %}{% block body %}
<div class="card"><h2>Expenses</h2><form class="row" method="post"><input type="hidden" name="_csrf" value="{{csrf}}">
<select name="category">{% for c in cats %}<option>{{c}}</option>{% endfor %}</select><input name="note" placeholder="Note"><input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required><input name="date" type="date" value="{{today}}"><button>Add</button></form></div>
<div class="card wide"><table><tr><th>Date<th>Category<th>Note<th>Amount<th></tr>
{% for r in rows %}<tr><td>{{r.date}}<td>{{r.category}}<td>{{r.note}}<td>{{'%.2f'|format(r.amount)}}<td><form method="post" action="{{url_for('delete',kind='expenses',rid=r.id,m=month)}}"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="link">Delete</button></form></tr>
{% else %}<tr><td colspan="5">Nothing recorded this month.</tr>{% endfor %}</table></div>{% endblock %}
