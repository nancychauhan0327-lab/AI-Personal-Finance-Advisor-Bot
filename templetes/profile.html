{% extends "base.html" %}{% block body %}
<div class="card"><h2>{{current_user.username}}</h2><form method="post" style="display:grid;gap:10px;max-width:480px">
<input type="hidden" name="_csrf" value="{{csrf}}">
<label>Savings goal <input name="savings_goal" type="number" step="0.01" value="{{current_user.savings_goal}}"></label>
<label>Financial goals <textarea name="goals" rows="3">{{current_user.goals}}</textarea></label>
<label>Add expense category <input name="category" placeholder="e.g. Education"></label><button>Save</button></form></div>
<div class="card"><h3>Expense categories</h3>{% for c in cats %}<form method="post" action="{{url_for('del_category',cid=c.id)}}" style="display:inline">
<input type="hidden" name="_csrf" value="{{csrf}}">{{c.name}} <button class="link">✕</button> &nbsp;</form>{% endfor %}</div>{% endblock %}
