{% extends "base.html" %}{% block body %}
<div class="card"><h2>Income</h2><form class="row" method="post"><input type="hidden" name="_csrf" value="{{csrf}}">
<input name="source" placeholder="Source (salary…)" required><input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required><input name="date" type="date" value="{{today}}"><button>Add</button></form></div>
<div class="card wide"><table><tr><th>Date<th>Source<th>Amount<th></tr>
{% for r in rows %}<tr><td>{{r.date}}<td>{{r.source}}<td>{{'%.2f'|format(r.amount)}}<td><form method="post" action="{{url_for('delete',kind='income',rid=r.id,m=month)}}"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="link">Delete</button></form></tr>
{% else %}<tr><td colspan="5">Nothing recorded this month.</tr>{% endfor %}</table></div>{% endblock %}
