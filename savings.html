{% extends "base.html" %}{% block body %}
<div class="card"><h2>Savings progress</h2><p><b>{{'%.2f'|format(total)}}</b> saved{% if goal %} of {{'%.2f'|format(goal)}} ({{pct}}%){% else %} — set a goal in Profile{% endif %}</p>
<div class="bar"><i style="width:{{pct}}%"></i></div></div>
<div class="card"><form class="row" method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
<input name="note" placeholder="Note"><input name="date" type="date" value="{{today}}"><button>Add deposit</button></form></div>
<div class="card wide"><table>{% for r in rows %}<tr><td>{{r.date}}<td>{{r.note}}<td>{{'%.2f'|format(r.amount)}}<td><form method="post" action="{{url_for('delete',kind='savings',rid=r.id)}}"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="link">Delete</button></form></tr>{% endfor %}</table></div>{% endblock %}
